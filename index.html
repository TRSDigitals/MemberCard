<!DOCTYPE html>
<html lang="en">
<head>

<title>Namma Vamadapadavu</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f4f6f8;
color:#222;
}

header{
background:#fff;
box-shadow:0 2px 10px rgba(0,0,0,.12);
position:sticky;
top:0;
z-index:1000;
}

.header-inner{
max-width:1200px;
margin:auto;
padding:10px 18px;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
}

.brand{
display:flex;
align-items:center;
gap:10px;
}

.brand-logo{
width:58px;
height:58px;
object-fit:contain;
border-radius:8px;
}

.brand-title{
color:#123d59;
font-size:22px;
font-weight:700;
}

.language-box{
display:flex;
align-items:center;
gap:7px;
}

.language-box select{
width:auto;
padding:8px;
}

nav{
display:flex;
gap:6px;
flex-wrap:wrap;
}

nav button{
border:0;
background:#123d59;
color:#fff;
padding:9px 13px;
border-radius:7px;
cursor:pointer;
font-weight:600;
}

nav button:hover{
background:#092b40;
}

.container{
width:min(1100px,94%);
margin:25px auto;
}

.page{
display:none;
}

.page.active{
display:block;
}

.box{
background:#fff;
padding:24px;
border-radius:12px;
box-shadow:0 3px 15px rgba(0,0,0,.08);
margin-bottom:20px;
}

.box h2{
margin-top:0;
color:#123d59;
}

.form-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.form-group{
display:flex;
flex-direction:column;
}

.full{
grid-column:1/-1;
}

label{
font-weight:600;
margin-bottom:6px;
}

input,
select,
textarea{
width:100%;
padding:11px;
border:1px solid #ccc;
border-radius:7px;
font-size:15px;
outline:none;
background:#fff;
}

input:focus,
select:focus,
textarea:focus{
border-color:#123d59;
}

textarea{
min-height:90px;
resize:vertical;
}

.other-box{
display:none;
margin-top:8px;
}

.other-box.show{
display:block;
}

.buttons{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:20px;
}

.btn{
border:0;
padding:11px 18px;
border-radius:7px;
cursor:pointer;
font-weight:600;
font-size:15px;
}

.primary{
background:#123d59;
color:#fff;
}

.success{
background:#198754;
color:#fff;
}

.danger{
background:#dc3545;
color:#fff;
}

.secondary{
background:#6c757d;
color:#fff;
}

.message{
display:none;
margin-top:15px;
padding:12px;
border-radius:7px;
}

.message.success{
display:block;
background:#d1e7dd;
color:#0f5132;
}

.message.error{
display:block;
background:#f8d7da;
color:#842029;
}

.search{
display:flex;
gap:10px;
}

.search input{
flex:1;
}

.photo-preview{
width:130px;
height:160px;
object-fit:cover;
border:1px dashed #aaa;
border-radius:7px;
display:none;
margin-top:10px;
}

.hidden{
display:none!important;
}


/* CARD */

.card-wrapper{
max-width:650px;
margin:25px auto;
}

.membership-card{
background:#fff;
border:2px solid #123d59;
border-radius:15px;
overflow:hidden;
box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.card-header{
background:#123d59;
color:#fff;
padding:15px;
display:flex;
align-items:center;
gap:12px;
}

.card-header img{
width:55px;
height:55px;
object-fit:contain;
background:#fff;
border-radius:8px;
}

.card-header h3{
margin:0 0 4px;
font-size:20px;
}

.card-body{
padding:20px;
display:grid;
grid-template-columns:130px 1fr;
gap:20px;
}

.member-photo{
width:120px;
height:145px;
object-fit:cover;
border:1px solid #aaa;
border-radius:7px;
}

.card-details p{
margin:0 0 9px;
}

.card-details strong{
color:#123d59;
}

.card-footer{
background:#f1f3f5;
padding:12px;
text-align:center;
font-size:13px;
}


/* MOBILE */

@media(max-width:900px){

.header-inner{
flex-direction:column;
}

nav{
justify-content:center;
width:100%;
}

}

@media(max-width:700px){

.form-grid{
grid-template-columns:1fr;
}

.full{
grid-column:auto;
}

}

@media(max-width:600px){

.header-inner{
padding:10px;
}

.brand-logo{
width:48px;
height:48px;
}

.brand-title{
font-size:18px;
}

nav button{
font-size:12px;
padding:8px 7px;
}

.container{
width:96%;
margin:15px auto;
}

.box{
padding:16px;
}

.search{
flex-direction:column;
}

.buttons .btn{
width:100%;
}

.card-body{
grid-template-columns:1fr;
text-align:center;
}

.member-photo{
margin:auto;
}

.card-details{
text-align:left;
}

}

@media print{

body *{
visibility:hidden;
}

#cardResult,
#cardResult *{
visibility:visible;
}

#cardResult{
position:absolute;
left:0;
top:0;
width:100%;
}

.no-print{
display:none!important;
}

}
</style>
</head>

/* =====================================================
WEBSITE LANGUAGE
===================================================== */

function changeLanguage(lang){

currentLanguage=lang;

const t=translations[lang];

document.querySelectorAll("[data-i18n]")
.forEach(el=>{

const key=el.getAttribute("data-i18n");

if(t[key]){
el.textContent=t[key];
}

});

updatePlaceholders();

}


/* =====================================================
PLACEHOLDERS
===================================================== */

const kn=currentLanguage==="kn";

kn?"ಪೂರ್ಣ ಹೆಸರು ನಮೂದಿಸಿ":"Enter full name";

kn?"ಮೊಬೈಲ್ ಸಂಖ್ಯೆ ನಮೂದಿಸಿ":"Enter mobile number";

/* =====================================================
MOBILE
===================================================== */

function validMobile(number){

return /^[6-9]\d{9}$/.test(number);

}


/* =====================================================
AGE
===================================================== */

function getAge(dob){

if(!dob)return "";

const birth=new Date(dob);

const today=new Date();

let age=
today.getFullYear()-birth.getFullYear();

const month=
today.getMonth()-birth.getMonth();

if(
month<0 ||
(month===0 &&
today.getDate()<birth.getDate())
){

age--;

}

return age;

}


document.getElementById("dob")
.addEventListener("change",function(){

document.getElementById("age").value=
getAge(this.value);

});

/* =====================================================
MEMBER ID
===================================================== */

async function generateMemberId(){

const ref=
db.collection("settings")
.doc("memberCounter");

let number=1;


await db.runTransaction(async transaction=>{

const snap=await transaction.get(ref);


if(snap.exists){

number=
(snap.data().value||0)+1;

}


transaction.set(
ref,
{value:number},
{merge:true}
);

});


return "VMP-"+String(number).padStart(6,"0");

}

document.getElementById("registerForm")
.addEventListener("submit",async function(e){

e.preventDefault();


const name=
capitalizeName(
document.getElementById("fullName")
.value.trim()
);


const mobile=
document.getElementById("mobile")
.value.trim();


if(!validMobile(mobile)){

showMessage(
"registerMessage",
"Enter a valid 10 digit mobile number.",
"error"
);

return;

}


const village=getVillageValue();

const occupation=getOccupationValue();


if(!village){

showMessage(
"registerMessage",
"Please select village.",
"error"
);

return;

}


if(!occupation){

showMessage(
"registerMessage",
"Please select occupation.",
"error"
);

return;

}


try{

const duplicate=
await members
.where("mobile","==",mobile)
.limit(1)
.get();


if(!duplicate.empty){

showMessage(
"registerMessage",
"This mobile number is already registered.",
"error"
);

return;

}


const memberId=
await generateMemberId();


const data={

memberId,

fullName:name,

mobile,

resident:
document.getElementById("resident").value,

village,

occupation,

place:
document.getElementById("place").value.trim(),

email:
document.getElementById("email").value.trim(),

dob:
document.getElementById("dob").value,

age:
getAge(document.getElementById("dob").value),

gender:
document.getElementById("gender").value,

bloodGroup:
document.getElementById("bloodGroup").value,

address:
document.getElementById("address").value.trim(),

photo:selectedPhoto,

createdAt:
firebase.firestore.FieldValue.serverTimestamp()

};


await members.add(data);


showMessage(
"registerMessage",
"Registration successful. Member ID: "+memberId,
"success"
);


clearRegistration();


}catch(error){

console.error(error);

showMessage(
"registerMessage",
"Firebase error: "+error.message,
"error"
);

}

});

/* =====================================================

===================================================== */

async function deleteMember(){

document.getElementById("deleteMobile")
.value.trim();


if(!validMobile(mobile)){

showMessage(
"deleteMessage",
"Enter a valid mobile number.",
"error"
);

return;

}


if(!confirm(
"Are you sure you want to delete this member?"
))return;


try{

const snap=
await members
.where("mobile","==",mobile)
.limit(1)
.get();


if(snap.empty){

showMessage(
"deleteMessage",
"Member not found.",
"error"
);

return;

}


await snap.docs[0].ref.delete();


showMessage(
"deleteMessage",
"Member deleted successfully.",
"success"
);


document.getElementById("deleteMobile")
.value="";


}catch(error){

console.error(error);

showMessage(
"deleteMessage",
"Firebase error: "+error.message,
"error"
);

}

}

/* =====================================================
ESCAPE
===================================================== */

function escapeHtml(value){

return String(value||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

/* =====================================================
ONLY FILLED CARD DETAILS
===================================================== */

function addCardRow(key,value){

if(
value===undefined||
value===null||
String(value).trim()===""
){

return "";

}


return `

<p>
<strong>${cardLabel(key)}:</strong>
${escapeHtml(value)}
</p>

`;

}

document.getElementById("membershipCard");


if(!card)return;


try{

if(typeof html2canvas==="undefined"){

await new Promise((resolve,reject)=>{

const script=
document.createElement("script");

script.src=
"https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";

script.onload=resolve;

script.onerror=reject;

document.head.appendChild(script);

});

}


const canvas=
await html2canvas(card,{

scale:2,

useCORS:true,

backgroundColor:"#ffffff"

});


const link=
document.createElement("a");


link.download=
"Namma-Vamadapadavu-Membership-Card.png";


link.href=
canvas.toDataURL("image/png");


link.click();


}catch(error){

console.error(error);

alert(

);a

}

}
